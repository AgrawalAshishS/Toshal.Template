<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://fonts.googleapis.com/css?family=Lato:100,300,400,700,900" rel="stylesheet">
    <link href="jquery.highlight-within-textarea.css" rel="stylesheet">
    <script src="https://unpkg.com/vue"></script>
    <script src="jquery.js"></script>
    <script src="jquery.highlight-within-textarea.js"></script>
    <script src="TemplateParser.js"></script>
    <title>Template View</title>
    <style type="text/css">
        * {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body{
            margin: 0;
            padding: 0;
            font-size: 14px;
            line-height: 18px;
            font-family: 'Lato', sans-serif;
        }

        ::-webkit-input-placeholder { 
            color:#d7d7d7;
            font-style: italic;
            font-weight: normal;
        }

        ::-moz-placeholder { 
            color: #d7d7d7;
            font-style: italic;
            font-weight: normal;
        }

        :-ms-input-placeholder {
            color: #d7d7d7;
            font-style: italic;
            font-weight: normal;
        }

        :-moz-placeholder { 
            color: #d7d7d7;
            font-style: italic;
            font-weight: normal;
        }

        input, select{
            border: none;
            background: transparent;
        }

        textarea {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 14px;
            line-height: 18px;
            font-family: 'Lato', sans-serif;
        }

        input:focus,
        input:hover,
        input:active,
        textarea:focus,
        textarea:hover,
        textarea:active,
        select:focus,
        select:hover,
        select:active,
        button:focus,
        button:hover,
        button:active{
            border: none;
            box-shadow: none;
            outline: none;
        }

        input{
            color: #555;
        }

        select,
        input.tag{
            color: #000080;
            font-weight: bold;
        }

        .light{
            font-size: 12px;
            color: #b5b5b5;
        }

        button{
            display: inline-block;
            margin: 0;
            padding: 6px 12px;
            font-size: 14px;
            line-height: 18px;
            background: #444;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.5s;
        }

        button:hover{
            background: #888;
        }

        .box button{
            padding: 2px 6px;
            font-size: 12px;
            background: #d7d7d7;
            color: #222;
        }

        .item{
            padding: 2px;
        }

        .item:hover{
            background: #ededed; 
        }

        .item button{
            opacity: 0;
        }

        .item:hover button{
            opacity: 1;
        }

        .box button:hover{
            background: #b5b5b5;
        }

        .nav{
            display: table;
            width: 100%;
            background: #222;
            position: fixed;
            top: 0;
            left: 0;
        }

        .left,
        .right{
            display: table-cell;
            padding: 12px;
        }

        .right{
            text-align: right;
        }

        .block {
            padding: 0 0 0 20px;
        }

        .box{
            padding: 10px;
            background: #fafafa;
            position: fixed;
            overflow: auto;
            top: 54px;
            bottom: 0;
            width: 50%;
            left: 0;
        }

        .item{
            margin: 2px 0;
        }

        .popup{
            position: fixed;
            top: 54px;
            right: 0;
            bottom: 0;
            width: 50%;
        }

        .popup textarea#jsonPreview{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            padding: 20px;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            white-space: pre;
        }

        .popup .actions{
            position: absolute;
            bottom: 5%;
            right: 5%;
        }

        .wrapper{
            position: relative;
            display: block;
        }

        .wrapper .hidden{
            visibility: hidden;
            padding: 2px;
        }

        .wrapper .content{
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="preview">
        <div class="nav">
            <div class="left">
                <button @click="addRootBlock">Add Block</button>
                <button @click="addRootContent">Add Content</button>
                <button @click="addRootToken">Add Token</button>
            </div>
            <div class="right">
                <button @click="uiPreview">Parse</button>
                <button @click="jsonPreview">Generate</button>
            </div>
        </div>
        <div class="box">
            <preview-item :preview-data="outputData" :tokens="tokenList"></preview-item>
        </div>
        <div class="popup">
            <textarea id="jsonPreview"></textarea>
        </div>
    </div>
    <script type="text/javascript">
        Vue.component('preview-item', {
            props: ["previewData", "tokens"],
            template: '\
                <div>\
                    <div v-for="(item,i) in previewData" class="block">\
                        <template v-if="item.type === \'block\'">\
                            <div class="item">\
                                <table cellspacing="0" cellpadding="0" border="0" width="100%">\
                                    <tr>\
                                        <td valign="middle" align="left">\
                                            <span class="light"><%</span>\
                                            <select type="text" v-model="item.tag" placeholder="Tag" @change="updateCode" @focus="alignTemplate(item)">\
                                                <option v-for="token in tokens" :value="token">{{token}}</option>\
                                            </select>\
                                            <input class="name" type="text" v-model="item.name" placeholder="Name" @change="updateCode" @focus="alignTemplate(item)">\
                                            <span class="light">%></span>\
                                        </td>\
                                        <td valign="middle" align="right">\
                                            <button @click="moveUp(item)">Up</button>\
                                            <button @click="addBlock(item)">Block</button>\
                                            <button @click="addContent(item)">Content</button>\
                                            <button @click="addToken(item)">Token</button>\
                                            <button @click="removeItem(i)">Delete</button>\
                                        </td>\
                                    </tr>\
                                </table>\
                            </div>\
                        </template>\
                        <template v-if="item.type === \'token\'">\
                            <div class="item">\
                              <table cellspacing="0" cellpadding="0" border="0" width="100%">\
                                    <tr>\
                                        <td valign="middle" align="left">\
                                            <span class="light"><%</span>\
                                            <input class="tag" type="text" v-model="item.tag" placeholder="Tag" @change="updateCode" @focus="alignTemplate(item)">\
                                            <input class="name" type="text" v-model="item.name" placeholder="Name" @change="updateCode" @focus="alignTemplate(item)">\
                                            <span class="light">%></span>\
                                        </td>\
                                        <td valign="middle" align="right">\
                                            <button @click="removeItem(i)">Delete</button>\
                                        </td>\
                                    </tr>\
                                </table>\
                            </div>\
                        </template>\
                        <template v-if="item.type === \'content\'">\
                            <div class="item">\
                                <table cellspacing="0" cellpadding="0" border="0" width="100%">\
                                    <tr>\
                                        <td valign="middle" align="left">\
                                            <div class="wrapper">\
                                                <div class="hidden" v-html="htmlConvertor(item.name)"></div>\
                                                <textarea class="content" v-model="item.name" rows="1" @change="updateCode" @focus="alignTemplate(item)"></textarea>\
                                            </div>\
                                        </td>\
                                        <td valign="middle" align="right">\
                                            <button @click="removeItem(i)">Delete</button>\
                                        </td>\
                                    </tr>\
                                </table>\
                            </div>\
                        </template>\
                        <preview-item class="child" :preview-data="item.subItems" :tokens="tokens"></preview-item>\
                    </div>\
                </div>',
            methods: {
                addBlock: function (item) {
                    item.subItems.push(newEmptyToken("block", true));
                },
                addContent: function (item) {
                    item.subItems.push(newEmptyToken("content", false));
                },
                addToken: function (item) {
                    item.subItems.push(newEmptyToken("token", false));
                },
                updateCode: function(){
                    document.getElementById("jsonPreview").value = fromTokenToTemplate(this.$root.outputData);
                },
                htmlConvertor: function(content){
                    return content.replace(/\n/g, "<br />");
                },
                alignTemplate: function(item){
                    var startCharPos = item.startCharPosition + 9,
                        endCharPos = startCharPos + item.tag.length;
                    if( item.tag.length < 1 ){
                        endCharPos = startCharPos + item.name.length;
                    }
                    $('#jsonPreview').highlightWithinTextarea({
                        highlight: [startCharPos, endCharPos]
                    });
                },
                removeItem: function(i){
                    this.previewData.splice(i, 1);
                    document.getElementById("jsonPreview").value = fromTokenToTemplate(this.$root.outputData);
                }
            }
        })
        new Vue({
            el: '#preview',
            data: {
                outputData: [],
                tokenList: [
                    "if", 
                    "else", 
                    "elseif", 
                    "foreach", 
                    "norecord", 
                    "header", 
                    "beforefirstrow", 
                    "firstrow", 
                    "afterfirstrow", 
                    "beforerow", 
                    "row", 
                    "afterrow", 
                    "beforealtrow", 
                    "altrow",
                    "afteraltrow",
                    "beforelastrow",
                    "lastrow",
                    "afterlastrow",
                    "footer",
                    "with",
                    "set"
                ]
            },
            methods: {
                addRootBlock: function () {
                    this.outputData.push(newEmptyToken("block", true));
                },
                addRootContent: function () {
                    this.outputData.push(newEmptyToken("content", false));
                },
                addRootToken: function () {
                    this.outputData.push(newEmptyToken("token", false));
                },
                jsonPreview: function(){
                    overallPosition = 1;
                    document.getElementById("jsonPreview").value = fromTokenToTemplate(this.outputData);
                },
                uiPreview: function(){
                    this.outputData = fromTemplateToTokens(document.getElementById("jsonPreview").value);
                }
            }
        })
    </script>
</body>

</html>
